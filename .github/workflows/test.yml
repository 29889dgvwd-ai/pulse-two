name: Node tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check server.js
      - run: node --check public/app.js
      - run: node --check ws-lite.js
      - run: node --check public/studio.js
      - run: node --check public/pet.js
      - run: node --check public/hype-features.js
      - run: node --check public/extra-features.js
      - run: node --check public/mini-experiences.js
      - run: node --check public/compact-hub.js
      - run: node --check public/compact-home.js
      - run: node --check public/game-categories.js
